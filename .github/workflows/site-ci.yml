name: Site CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run SEO audit
        run: npm run seo:audit
